<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Widget Debugger</title>
    <style>
        body {
            background-color: #222;
            color: #ddd;
            font-family: sans-serif;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .container {
            display: flex;
            gap: 20px;
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 300px;
            background: #333;
            padding: 20px;
            border-radius: 8px;
        }

        .widget-area {
            flex: 1;
            background: #2a2a2a;
            padding: 40px;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        label {
            display: flex;
            justify-content: space-between;
        }

        input[type="range"] {
            width: 100%;
        }
    </style>
    <script type="module">
        import { LitElement, html, css } from 'lit';
        import { makeAutoObservable, observable } from 'mobx';
        import '../views/graph-widget.ts';
        import '../views/scalar-slider.ts';

        // 1. Single Segment Config
        class DebugConfig {
            constructor() {
                this.domain = [0, 1];
                this.range = [0, 1];
                this.value = 0; // Linear
                this.interactive = true;
                makeAutoObservable(this);
            }

            get segments() {
                return [{
                    id: 'seg1',
                    weight: 1,
                    curve: { type: 'exponential', value: this.value }
                }];
            }

            onSegmentChange(id, param, value) {
                if (param === 'value') {
                    this.value = value;
                    document.getElementById('exponent').value = value;
                    document.getElementById('exponent-val').textContent = value.toFixed(2);
                }
            }
        }

        // 2. Multi-Segment Config
        class MultiSegmentConfig {
            constructor() {
                this.domain = [0, 1];
                this.range = [0, 1];
                this.segmentsData = [
                    { id: 's1', weight: 1, value: 0.5 },
                    { id: 's2', weight: 1, value: 0.0 },
                    { id: 's3', weight: 1, value: -0.5 },
                    { id: 's4', weight: 1, value: -1.0 }
                ];
                this.interactive = true;
                makeAutoObservable(this);
            }

            get segments() {
                return this.segmentsData.map(s => ({
                    id: s.id,
                    weight: s.weight,
                    curve: { type: 'exponential', value: s.value }
                }));
            }

            onSegmentChange(id, param, value) {
                const segment = this.segmentsData.find(s => s.id === id);
                if (segment && param === 'value') segment.value = value;
            }

            onSegmentResize(index, newWeight) {
                if (this.segmentsData[index]) this.segmentsData[index].weight = newWeight;
            }
        }

        // 3. Mixed Types Config
        class MixedTypesConfig {
            constructor() {
                this.domain = [0, 1];
                this.range = [-1, 1];
                this.interactive = true;
                this.segmentsData = [
                    { id: 's1', weight: 1, type: 'linear', value: 0 },
                    { id: 's2', weight: 1, type: 'step', value: 4 },
                    { id: 's3', weight: 1, type: 'sin', value: 0 },
                    { id: 's4', weight: 1, type: 'quad', value: 0 },
                    {
                        id: 's5', weight: 1, type: 'points', points: [{ x: 0, y: 0 }, { x: 0.2, y: 0.8 }, { x: 0.5, y: -0.5 }, { x: 0.8, y: 0.2 }, {
                            x: 1,
                            y: 0
                        }]
                    }
                ];
                makeAutoObservable(this);
            }

            get segments() {
                return this.segmentsData.map(s => ({
                    id: s.id,
                    weight: s.weight,
                    curve: { type: s.type, value: s.value, points: s.points }
                }));
            }
        }

        // 4. Step Sequencer Config
        class StepSequencerConfig {
            constructor() {
                this.domain = [0, 1];
                this.range = [0, 1];
                this.interactive = true;
                this.segmentsData = Array.from({ length: 8 }, (_, i) => ({
                    id: `s${i}`, weight: 1, type: 'step', value: Math.floor(Math.random() * 4) + 2
                }));
                makeAutoObservable(this);
            }

            get segments() {
                return this.segmentsData.map(s => ({
                    id: s.id, weight: s.weight, curve: { type: s.type, value: s.value }
                }));
            }
        }

        // 5. ADSR Config
        class ADSRConfig {
            constructor() {
                this.domain = [0, 1];
                this.range = [0, 1];
                this.interactive = true;
                this.segmentsData = [
                    { id: 'a', weight: 1, type: 'linear', value: 0 },
                    { id: 'd', weight: 1, type: 'exponential', value: 0.5 },
                    { id: 's', weight: 2, type: 'step', value: 1 },
                    { id: 'r', weight: 1, type: 'exponential', value: -0.5 }
                ];
                makeAutoObservable(this);
            }

            get segments() {
                return this.segmentsData.map(s => ({
                    id: s.id, weight: s.weight, curve: { type: s.type, value: s.value }
                }));
            }
        }

        // Render Helper
        function renderWidget(title, config) {
            const container = document.createElement('div');
            container.style.marginBottom = '20px';

            const label = document.createElement('div');
            label.textContent = title;
            label.style.marginBottom = '5px';
            label.style.color = '#aaa';
            label.style.fontSize = '12px';

            const widget = document.createElement('graph-widget');
            widget.config = config;

            container.appendChild(label);
            container.appendChild(widget);
            document.querySelector('.widget-area').appendChild(container);
            return config;
        }

        // Initialize
        const config = new DebugConfig();
        renderWidget('Interactive (Exponential)', config);

        const multiConfig = new MultiSegmentConfig();
        renderWidget('Multi-Segment', multiConfig);

        const mixedConfig = new MixedTypesConfig();
        renderWidget('Mixed Curve Types', mixedConfig);

        const stepConfig = new StepSequencerConfig();
        renderWidget('Step Sequencer', stepConfig);

        const adsrConfig = new ADSRConfig();
        renderWidget('ADSR Envelope', adsrConfig);


        // Controls
        const exponentInput = document.getElementById('exponent');
        const exponentVal = document.getElementById('exponent-val');

        exponentInput.addEventListener('input', (e) => {
            config.value = parseFloat(e.target.value);
            exponentVal.textContent = config.value.toFixed(2);
        });

        const interactiveCheck = document.getElementById('interactive');
        interactiveCheck.addEventListener('change', (e) => {
            config.interactive = e.target.checked;
        });
    </script>
</head>

<body>
    <h1>Widget Debugger</h1>
    <div class="container">
        <div class="controls">
            <h3>Graph Widget Controls</h3>
            <label>
                Exponent: <span id="exponent-val">2.00</span>
            </label>
            <input type="range" id="exponent" min="-1" max="1" step="0.01" value="0">

            <label>
                Interactive
                <input type="checkbox" id="interactive" checked>
            </label>
        </div>
        <div class="widget-area" style="flex-direction: column; gap: 20px; align-items: stretch;">
            <!-- Widget will be injected here -->

            <!-- Widget will be injected here -->

            <div style="background: #333; padding: 20px; border-radius: 8px;">
                <h3>Scalar Slider Examples</h3>
                <div style="margin-bottom: 10px; display: flex; align-items: center; gap: 10px;">
                    <label style="width: 150px;">Default</label>
                    <scalar-slider value="0" defaultValue="0" style="width: 220px;"></scalar-slider>
                </div>
                <div style="margin-bottom: 10px; display: flex; align-items: center; gap: 10px;">
                    <label style="width: 150px;">Range (0-100)</label>
                    <scalar-slider min="0" max="100" value="50" defaultValue="0" style="width: 220px;"></scalar-slider>
                </div>
                <div style="margin-bottom: 10px; display: flex; align-items: center; gap: 10px;">
                    <label style="width: 150px;">Step (0.1)</label>
                    <scalar-slider step="0.1" value="0.5" defaultValue="0.5" style="width: 220px;"></scalar-slider>
                </div>
                <div style="margin-bottom: 10px; display: flex; align-items: center; gap: 10px;">
                    <label style="width: 150px;">Integer (Step 1)</label>
                    <scalar-slider step="1" value="10" defaultValue="10" style="width: 220px;"></scalar-slider>
                </div>
            </div>
        </div>
        </div>
    </div>
</body>

</html>
